<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Share Yusr</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 520px;
      margin: 0 auto;
      padding: 56px 24px;
      line-height: 1.6;
      color: #111;
      text-align: center;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 32px;
    }

    button, .link {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin: 12px 0;
      padding: 16px;
      border-radius: 14px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }

    #share {
      background: #087f6b;
      color: #fff;
      border: none;
      font-size: 1.1em;
    }

    #copy, .link {
      background: none;
      color: #087f6b;
      border: 1px solid #087f6b;
    }

    #status {
      min-height: 1.6em;
      color: #666;
    }

    a {
      color: #087f6b;
      overflow-wrap: anywhere;
    }

    @media (prefers-color-scheme: dark) {
      body { background: #111; color: #eee; }
      .subtitle, #status { color: #aaa; }
    }
  </style>
</head>

<body>

<h1>Share Yusr 🤍</h1>
<p class="subtitle">Help spread the Quran. Every share matters.</p>

<button id="share" type="button">Share Yusr</button>
<button id="copy" type="button">Copy link</button>
<a class="link" href="https://linktr.ee/yusrquranapp">Open linktr.ee/yusrquranapp</a>
<p id="status" role="status"></p>

<p>Jazakum Allahu Khairan 🤍</p>

<script>
  var LINK = 'https://linktr.ee/yusrquranapp';
  var TEXT = 'Yusr – Quran Companion: read, listen and reflect on the Quran. Free, with no ads.';
  var status = document.getElementById('status');
  var shareButton = document.getElementById('share');

  // The share sheet needs a tap on this page (browsers only open it from a user gesture).
  if (!navigator.share) shareButton.style.display = 'none';

  shareButton.addEventListener('click', function () {
    navigator.share({ title: 'Yusr – Quran Companion', text: TEXT, url: LINK }).catch(function () {});
  });

  document.getElementById('copy').addEventListener('click', function () {
    function done() { status.textContent = 'Link copied.'; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(LINK).then(done, function () { status.textContent = LINK; });
    } else {
      status.textContent = LINK;
    }
  });
</script>

</body>
</html>
